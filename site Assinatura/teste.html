<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Assinatura</title>

<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 20px;
  }

  #wrapper {
    max-width: 600px;
    margin: auto;
  }

  canvas {
    border: 2px solid #000;
    width: 100%;
    height: 250px;
    touch-action: none;
    cursor: crosshair;
    background: #fff;
  }

  button {
    margin: 10px 5px;
    padding: 10px 15px;
    font-size: 14px;
  }
</style>
</head>

<body>

<div id="wrapper">
  <h3>Assine abaixo</h3>

  <canvas id="pad" width="600" height="250"></canvas>

  <div>
    <button onclick="limpar()">Limpar</button>
    <button onclick="confirmar()">Confirmar assinatura</button>
  </div>
</div>

<script>
  const canvas = document.getElementById("pad");
  const ctx = canvas.getContext("2d");

  let desenhando = false;

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const evt = e.touches ? e.touches[0] : e;
    return {
      x: (evt.clientX - rect.left) * (canvas.width / rect.width),
      y: (evt.clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function start(e) {
    desenhando = true;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    e.preventDefault();
  }

  function draw(e) {
    if (!desenhando) return;
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.stroke();
    e.preventDefault();
  }

  function end(e) {
    desenhando = false;
    e && e.preventDefault();
  }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", draw);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);

  canvas.addEventListener("touchstart", start, { passive:false });
  canvas.addEventListener("touchmove", draw, { passive:false });
  canvas.addEventListener("touchend", end);

  function limpar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function confirmar() {
    const base64 = canvas.toDataURL("image/png");

    // 🔁 Retorno para quem abriu a página
    if (window.opener) {
      window.opener.postMessage(
        { assinatura: base64 },
        "*"
      );
      window.close();
    } else {
      alert("Assinatura capturada!");
      console.log(base64);
    }
  }
</script>

</body>
</html>
